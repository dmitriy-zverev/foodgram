volumes: 
  pg_data:
  static:

services:
  db:
    image: postgres:14
    env_file:
      - ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ../backend/foodgram/
    env_file: ../.env
    volumes:
      - static:/static
    depends_on:
      - db
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - static:/static
  nginx:
    build: ./
    env_file:
      - ../.env
    ports:
      - "80:80"
    volumes:
      - static:/static
      - ../docs/redoc.html:/static/redoc.html:ro
      - ../docs/openapi-schema.yml:/static/openapi-schema.yml:ro
    depends_on:
      - backend
