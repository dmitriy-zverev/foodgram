volumes: 
  pg_data:
  static:

services:
  db:
    image: postgres:14
    env_file:
      - ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - static:/static
  nginx:
    image: nginx:latest
    env_file:
      - ../.env
    ports:
      - "80:80"
    volumes:
      - static:/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
