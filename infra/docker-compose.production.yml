volumes: 
  pg_data_production:
  static_production:
  images_production:

services:
  db:
    image: postgres:14
    env_file:
      - .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: dmitriyvzverev/foodgram_backend/
    env_file: .env
    volumes:
      - static_production:/static
      - images_production:/app/images
    depends_on:
      - db
  frontend:
    image: dmitriyvzverev/foodgram_frontend
    volumes:
      - static_production:/static
  nginx:
    image: dmitriyvzverev/foodgram_nginx
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - static_production:/static
      - images_production:/app/images
    depends_on:
      - backend
